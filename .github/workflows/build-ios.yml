name: Build iOS

# Run it by hand from the Actions tab. No Apple account is needed for this:
# it builds the app for the iOS Simulator, starts it there and takes
# screenshots, then checks an unsigned iPhone build compiles.
# The first run takes about an hour; later runs reuse the compiled libraries.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest Cython==0.29.37
      - run: python -m pytest -q tests

  build:
    needs: test
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config || true
          brew link libtool || true
          xcodebuild -version

      - name: Reuse compiled libraries
        uses: actions/cache@v4
        with:
          path: |
            ios/build/kivy-ios/build
            ios/build/kivy-ios/dist
            ios/build/kivy-ios/.cache
          key: kivy-ios-${{ runner.os }}-${{ hashFiles('ios/build.sh', 'ios/recipes/**') }}

      - name: Build for the Simulator
        env:
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: bash ios/build.sh simulator

      - name: Start it on a simulated iPhone
        run: |
          bash ios/simulator_smoke.sh \
            ios/build/derived/Build/Products/Release-iphonesimulator/stringwise.app \
            simulator-check

      - name: Check an unsigned iPhone build compiles
        env:
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: bash ios/build.sh device

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StringWise-ios-simulator-check
          path: simulator-check/
          if-no-files-found: ignore

      - name: Keep the Simulator app
        if: success()
        run: |
          cd ios/build/derived/Build/Products/Release-iphonesimulator
          ditto -c -k --keepParent stringwise.app "$GITHUB_WORKSPACE/StringWise-simulator.zip"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: StringWise-simulator-app
          path: StringWise-simulator.zip

