name: Build Android

# Run it by hand from the Actions tab, or push a tag such as v2.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: python -m pytest -q tests

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ccache cmake gettext git libffi-dev \
            libltdl-dev libssl-dev libtool patch pkg-config unzip zip zlib1g-dev
          pip install --upgrade pip wheel
          pip install git+https://github.com/kivy/buildozer@master

      - name: Cache the Android toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Debug APK (for installing on your own phone)
        run: buildozer android debug

      - name: Check for the upload key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::No signing secrets set, so the Play Store bundle was skipped. See the README."
          fi

      - name: Signed release bundle (for Google Play)
        if: steps.key.outputs.present == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          export P4A_RELEASE_KEYSTORE="$RUNNER_TEMP/upload.keystore"
          buildozer android release
          rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: stringwise-android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
